# Lightweight dev stack — API + Worker + Postgres + Redis only (no Moodle)
# Usage: docker compose -f docker-compose.dev.yml up --build

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://plagiarism:plagiarism@postgres:5432/plagiarism
  DATABASE_URL_SYNC: postgresql://plagiarism:plagiarism@postgres:5432/plagiarism
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  API_SECRET_KEY: dev-secret-key-change-in-production
  UPLOAD_DIR: /data/uploads
  FAISS_INDEX_PATH: /data/faiss/index.faiss
  EMBEDDING_MODEL: all-MiniLM-L6-v2
  EMBEDDING_DEVICE: cpu
  CHUNK_SIZE: "256"
  CHUNK_OVERLAP: "50"
  TAU_LOW: "0.20"
  TAU_HIGH: "0.65"
  ALPHA: "0.6"
  WINNOW_K: "5"
  WINNOW_W: "4"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  TOKENIZERS_PARALLELISM: "false"
  SENTENCE_TRANSFORMERS_HOME: /data/models
  HF_HOME: /data/models

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plagiarism
      POSTGRES_PASSWORD: plagiarism
      POSTGRES_DB: plagiarism
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plagiarism"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6385:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --reload
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - upload_data:/data/uploads
      - faiss_data:/data/faiss

  celery-worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=info --queues=extraction,detection,embedding,indexing,default --pool=solo
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - upload_data:/data/uploads
      - faiss_data:/data/faiss
    deploy:
      resources:
        limits:
          memory: 4G

  flower:
    build: ./backend
    command: celery -A app.tasks.celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      <<: *backend-env
    depends_on:
      - celery-worker

volumes:
  pgdata:
  upload_data:
  faiss_data:
